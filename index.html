<!DOCTYPE html><html lang="en"><head>


<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WRE — FIG Wireframes</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=DM+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #f8fafc;
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Wireframe sketch palette */
  :root {
    --ink: #1a1a1a;
    --ink-light: #555;
    --ink-faint: #aaa;
    --paper: #ffffff;
    --paper-warm: #f8fafc;
    --border: #e2e8f0;
    --border-light: #f1f5f9;
    --purple-am: #e8e0f5;
    --purple-am-border: #9b7ec8;
    --pink-pm: #fce4ec;
    --pink-pm-border: #e06090;
    --pto: #2a2a2a;
    --callout: #fff3cd;
    --callout-border: #d4a800;
    --oncall: #d4edda;
    --oncall-border: #4caf50;
    --training: #e3f2fd;
    --training-border: #1976d2;
    --red-urgent: #e53935;
    --amber-mid: #f59e0b;
    --gray-low: #9ca3af;
    --note-dot: #4f46e5;
    --sketch-shadow: 0 1px 3px rgba(0,0,0,0.07), 0 4px 12px rgba(0,0,0,0.05);
  }

  /* Sketch-style card */
  .sketch-card {
    background: var(--paper);
    border: 1.5px solid var(--border);
    border-radius: 4px;
    box-shadow: var(--sketch-shadow);
  }

  /* Navigation tabs */
  .nav-tabs {
    display: flex;
    gap: 0;
    padding: 16px 24px 0;
    border-bottom: 2px solid var(--border);
    background: var(--paper-warm);
  }
  .nav-tab {
    padding: 10px 20px;
    font-family: 'DM Sans', sans-serif;
    font-size: 17px;
    font-weight: 600;
    color: var(--ink-light);
    cursor: pointer;
    border: 1.5px solid transparent;
    border-bottom: none;
    border-radius: 4px 4px 0 0;
    background: transparent;
    transition: all 0.15s;
    position: relative;
    bottom: -2px;
    white-space: nowrap;
  }
  .nav-tab:hover { color: var(--ink); background: #f1f5f9; }
  .nav-tab.active {
    color: #4f46e5;
    background: var(--paper);
    border-color: #e2e8f0;
    border-bottom-color: var(--paper);
    border-top: 2px solid #4f46e5;
  }
  .nav-tab .tab-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--red-urgent);
    color: white;
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    margin-left: 6px;
    vertical-align: middle;
    font-weight: 500;
  }

  /* Screen wrapper */
  .screen-container {
    padding: 24px;
    max-width: 960px;
    margin: 0 auto;
  }

  /* Annotation labels */
  .annotation {
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    color: var(--note-dot);
    font-style: italic;
  }
  .annotation-box {
    border: 1.5px dashed var(--note-dot);
    border-radius: 3px;
    padding: 4px 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    color: var(--note-dot);
    display: inline-block;
  }

  /* ===== SCREEN 1: Monthly Grid ===== */
  .grid-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    gap: 12px;
  }
  .branch-label {
    font-size: 24px;
    font-weight: 700;
    color: var(--ink);
  }
  .status-chip {
    padding: 3px 10px;
    border-radius: 20px;
    border: 1.5px solid var(--oncall-border);
    background: var(--oncall);
    font-size: 14px;
    color: #2e7d32;
  }
  .month-nav {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .month-nav-btn {
    width: 28px; height: 28px;
    border: 1.5px solid var(--border);
    border-radius: 3px;
    background: var(--paper);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: var(--ink);
    font-family: 'DM Sans', sans-serif;
    transition: background 0.1s;
  }
  .month-nav-btn:hover { background: var(--paper-warm); }
  .month-label { font-size: 18px; font-weight: 600; color: var(--ink); }

  .toggle-months {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    color: var(--ink-light);
    cursor: pointer;
  }
  .toggle-switch {
    width: 32px; height: 18px;
    border-radius: 9px;
    border: 1.5px solid var(--border);
    background: #e2e8f0;
    position: relative;
    transition: background 0.2s;
  }
  .toggle-switch.on { background: #4f46e5; border-color: #4f46e5; }
  .toggle-knob {
    position: absolute;
    top: 2px; left: 2px;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: white;
    transition: left 0.2s;
  }
  .toggle-switch.on .toggle-knob { left: 16px; }

  .grid-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 15px;
  }
  .grid-table th {
    font-weight: 600;
    color: var(--ink-light);
    text-align: left;
    padding: 6px 8px;
    border-bottom: 1.5px solid var(--border);
    white-space: nowrap;
    font-size: 14px;
  }
  .grid-table th.day-col {
    text-align: center;
    font-size: 13px;
    color: var(--ink-light);
    width: 52px;
  }
  .grid-table td {
    padding: 8px;
    border-bottom: 1px solid var(--border-light);
    vertical-align: middle;
  }
  .grid-table td.day-cell {
    text-align: center;
    padding: 4px 2px;
  }
  .grid-table tr:hover td { background: #f8fafc; }

  .driver-name { font-weight: 700; font-size: 16px; }
  .driver-meta { font-size: 13px; color: var(--ink-light); }

  .shift-chip {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px; height: 32px;
    border-radius: 3px;
    font-size: 13px;
    font-weight: 600;
    border: 1.5px solid transparent;
    cursor: pointer;
    position: relative;
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .shift-chip:hover { transform: scale(1.08); box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
  .shift-chip.wa { background: var(--purple-am); border-color: var(--purple-am-border); color: #5b3a9a; }
  .shift-chip.wp { background: var(--pink-pm); border-color: var(--pink-pm-border); color: #9c2152; }
  .shift-chip.pto { background: var(--pto); color: white; border-color: var(--pto); }
  .shift-chip.co { background: var(--callout); border-color: var(--callout-border); color: #7a5900; }
  .shift-chip.oc { background: var(--oncall); border-color: var(--oncall-border); color: #1b5e20; }
  .shift-chip.tr { background: var(--training); border-color: var(--training-border); color: #0d47a1; }
  .shift-chip.empty { background: transparent; border-color: transparent; color: var(--ink-faint); font-size: 18px; }

  .note-dot {
    position: absolute;
    top: 3px; right: 3px;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--note-dot);
  }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 14px;
    font-size: 13px;
    color: var(--ink-light);
    align-items: center;
  }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-swatch {
    width: 20px; height: 14px;
    border-radius: 2px;
    border: 1px solid transparent;
    display: inline-block;
  }

  /* ===== Paint mode toolbar (Screen 1 enhancement) ===== */
  .paint-toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: var(--paper);
    border: 1.5px solid var(--border);
    border-radius: 4px;
    margin-bottom: 12px;
    box-shadow: var(--sketch-shadow);
    flex-wrap: wrap;
  }
  .paint-toolbar-label {
    font-size: 13px; font-weight: 600; color: var(--ink-light);
    margin-right: 4px;
  }
  .paint-chip {
    padding: 6px 14px;
    border-radius: 4px;
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border: 1.5px solid transparent;
    transition: all 0.12s ease;
    user-select: none;
  }
  .paint-chip.wa  { background: var(--purple-am); border-color: var(--purple-am-border); color: #5b3a9a; }
  .paint-chip.wp  { background: var(--pink-pm);   border-color: var(--pink-pm-border);   color: #9c2152; }
  .paint-chip.pto { background: var(--pto);       border-color: var(--pto);              color: #f1efe8; }
  .paint-chip.co  { background: var(--callout);   border-color: var(--callout-border);   color: #7a5900; }
  .paint-chip.oc  { background: var(--oncall);    border-color: var(--oncall-border);    color: #1b5e20; }
  .paint-chip.clear {
    background: var(--paper-warm); border-color: var(--border); color: var(--ink-light);
  }
  .paint-chip:hover { transform: translateY(-1px); }
  .paint-chip.active {
    box-shadow: 0 0 0 3px rgba(79,70,229,0.22);
    transform: translateY(-1px);
  }
  .paint-chip.active::after { content: ' ✓'; }
  .paint-help {
    margin-left: auto;
    font-size: 12px;
    color: #4f46e5;
    font-weight: 500;
  }
  .paint-status {
    margin-top: -4px;
    margin-bottom: 12px;
    padding: 8px 14px;
    background: #eef2ff;
    border: 1.5px dashed #a5b4fc;
    border-radius: 4px;
    font-size: 13px;
    color: #3730a3;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .paint-status .pulse {
    width: 8px; height: 8px; border-radius: 50%;
    background: #4f46e5;
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }
  body.paint-active .day-cell { cursor: crosshair; }
  body.paint-active .day-cell:hover .shift-chip {
    outline: 2px dashed #4f46e5;
    outline-offset: 2px;
  }
  .shift-chip.just-painted {
    outline: 2px solid #4f46e5;
    outline-offset: 2px;
    animation: justPainted 0.6s ease-out forwards;
  }
  @keyframes justPainted {
    0%   { outline-color: #4f46e5; outline-offset: 4px; }
    100% { outline-color: transparent; outline-offset: 2px; }
  }

  /* Row-select checkbox */
  .row-check-col { width: 36px; padding: 8px 4px 8px 14px !important; }
  .row-check {
    width: 16px; height: 16px;
    border: 1.5px solid var(--border);
    border-radius: 3px;
    background: var(--paper-warm);
    cursor: pointer;
    display: inline-block;
    position: relative;
    vertical-align: middle;
  }
  .row-check.checked {
    background: #4f46e5;
    border-color: #4f46e5;
  }
  .row-check.checked::after {
    content: '';
    position: absolute;
    left: 4px; top: 1px;
    width: 5px; height: 9px;
    border: solid white;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }
  tr.row-selected td { background: rgba(79,70,229,0.06); }

  /* ===== SCREEN 0: Branch Home ===== */
  .branch-home-header {
    background: var(--paper);
    border: 1.5px solid var(--border);
    border-bottom: none;
    border-radius: 4px 4px 0 0;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .branch-home-title { font-size: 18px; font-weight: 700; color: var(--ink); }
  .branch-home-subtitle {
    font-size: 13px; color: var(--ink-light);
    margin-top: 2px; font-family: 'DM Mono', monospace;
  }
  .role-pill {
    font-size: 12px; font-weight: 600;
    padding: 4px 10px; border-radius: 999px;
    background: var(--paper-warm);
    border: 1px solid var(--border);
    color: var(--ink-light);
  }
  .role-pill.central { background:#e3f2fd; border-color:#1976d2; color:#114b8a; }
  .role-pill.branch  { background:#d4edda; border-color:#4caf50; color:#2a5e2c; }
  .branch- {
    padding: 6px 10px; font-size: 13px;
    border: 1.5px solid var(--border); border-radius: 4px;
    width: 200px; background: var(--paper-warm);
    font-family: 'DM Sans', sans-serif;
  }
  .branch-:focus { outline: 2px solid #4f46e5; outline-offset: -1px; }

  .region-section {
    background: var(--paper);
    border-left: 1.5px solid var(--border);
    border-right: 1.5px solid var(--border);
    padding: 12px 18px 8px;
  }
  .region-section + .region-section { border-top: 1.5px solid var(--border-light); }
  .region-section.last-region { border-bottom: 1.5px solid var(--border); border-radius: 0 0 4px 4px; padding-bottom: 14px; }
  .region-header {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 10px;
    font-family: 'DM Mono', monospace;
  }
  .region-name {
    font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.6px;
    color: var(--ink-light);
  }
  .region-attn { font-size: 11px; color: var(--ink-faint); }
  .region-attn.alert { color: #b03060; font-weight: 600; }

  .branch-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  @media (max-width: 1100px) { .branch-grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 800px)  { .branch-grid { grid-template-columns: repeat(2, 1fr); } }

  .branch-card {
    background: var(--paper-warm);
    border: 1.5px solid var(--border);
    border-radius: 4px;
    padding: 10px 12px;
    cursor: pointer;
    transition: all 0.15s ease;
    position: relative;
    box-shadow: 1px 2px 0 rgba(0,0,0,0.04);
  }
  .branch-card:hover {
    transform: translateY(-2px);
    box-shadow: 2px 4px 0 rgba(0,0,0,0.08);
    border-color: #4f46e5;
  }
  .branch-card-name {
    font-size: 14px; font-weight: 600; color: var(--ink);
    display: flex; justify-content: space-between; align-items: flex-start;
    margin-bottom: 4px;
  }
  .branch-star { color: #d4a800; font-size: 13px; }
  .branch-meta { font-size: 12px; color: var(--ink-light); margin-bottom: 8px; font-family: 'DM Mono', monospace; }
  .branch-status-pill {
    font-size: 11px; font-weight: 600;
    padding: 3px 9px; border-radius: 999px; display: inline-block;
  }
  .branch-status-pill.green { background: var(--oncall); border: 1px solid var(--oncall-border); color: #1b5e20; }
  .branch-status-pill.amber { background: var(--callout); border: 1px solid var(--callout-border); color: #7a5900; }
  .branch-status-pill.red   { background: #ffe5e5; border: 1px solid #c62828; color: #8b0000; }
  .branch-status-pill.acquisition { background: #fce4ec; border: 1px solid #ad1457; color: #88002a; }

  .branch-card.detailed { padding: 14px 16px; }
  .branch-card.detailed .branch-card-name { font-size: 15px; }
  .branch-stat-row {
    display: flex; justify-content: space-between;
    font-size: 12px; padding: 2px 0;
    font-family: 'DM Mono', monospace;
  }
  .branch-stat-row .label { color: var(--ink-light); }
  .branch-stat-row .value { font-weight: 600; color: var(--ink); }
  .branch-stat-row .value.warn { color: #7a5900; }
  .branch-stat-row .value.bad { color: #8b0000; }
  .branch-stat-row .value.good { color: #1b5e20; }
  .branch-card-divider {
    border-top: 1px solid var(--border-light);
    margin: 10px 0 8px;
  }

  .branch-home-footer {
    background: var(--paper);
    border: 1.5px solid var(--border);
    border-top: none;
    border-radius: 0 0 4px 4px;
    padding: 10px 18px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12px; color: var(--ink-light);
  }
  .branch-home-footer a { color: #4f46e5; cursor: pointer; font-weight: 600; }
  .breadcrumb {
    font-size: 13px;
    color: var(--ink-light);
    padding: 8px 24px 0;
    font-family: 'DM Mono', monospace;
  }
  .breadcrumb a { color: #4f46e5; cursor: pointer; }
  .breadcrumb a:hover { text-decoration: underline; }
  .breadcrumb .sep { margin: 0 6px; color: var(--ink-faint); }

  .role-switcher {
    display: flex; gap: 4px;
    background: var(--paper-warm);
    border: 1.5px solid var(--border);
    border-radius: 4px;
    padding: 3px;
  }
  .role-switcher button {
    background: transparent; border: none;
    padding: 5px 12px;
    font-size: 12px; font-weight: 600;
    color: var(--ink-light);
    cursor: pointer;
    border-radius: 3px;
    font-family: 'DM Sans', sans-serif;
  }
  .role-switcher button.active {
    background: var(--ink);
    color: var(--paper);
  }

  /* ===== SCREEN 2: Day Detail Panel ===== */
  .panel-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.25);
    display: flex;
    align-items: center;
    justify-content: flex-end;
    z-index: 100;
    padding: 24px;
  }
  .detail-panel {
    width: 420px;
    max-height: 90vh;
    overflow-y: auto;
    background: var(--paper);
    border: 1.5px solid var(--border);
    border-radius: 6px;
    box-shadow: 4px 8px 32px rgba(0,0,0,0.18);
    padding: 0;
    animation: slideIn 0.2s ease;
  }
  @keyframes slideIn {
    from { transform: translateX(30px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }
  .panel-top {
    padding: 20px 20px 16px;
    border-bottom: 1.5px solid var(--border-light);
  }
  .panel-driver-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }
  .driver-avatar {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--purple-am);
    border: 1.5px solid var(--purple-am-border);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 700; color: #5b3a9a;
    flex-shrink: 0;
  }
  .driver-info { flex: 1; }
  .driver-info h2 { font-size: 21px; font-weight: 700; color: var(--ink); }
  .driver-info p { font-size: 14px; color: var(--ink-light); margin-top: 2px; }
  .status-badge {
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 600;
    background: var(--purple-am);
    border: 1.5px solid var(--purple-am-border);
    color: #5b3a9a;
    white-space: nowrap;
  }
  .panel-date {
    margin-top: 12px;
    font-size: 14px; color: var(--ink-light);
  }
  .panel-date strong {
    display: block;
    font-size: 16px;
    color: var(--ink);
    margin-top: 2px;
  }

  .panel-section {
    padding: 16px 20px;
    border-bottom: 1.5px solid var(--border-light);
  }
  .info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 10px;
  }
  .info-block {
    background: var(--paper-warm);
    border: 1px solid var(--border-light);
    border-radius: 3px;
    padding: 10px 12px;
  }
  .info-block label {
    font-size: 12px;
    color: var(--ink-light);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-family: 'DM Mono', monospace;
  }
  .info-block .info-val {
    font-size: 16px;
    font-weight: 700;
    color: var(--ink);
    margin-top: 3px;
  }

  .supervisor-note-box {
    background: #eef2ff;
    border: 1.5px solid #c7d2fe;
    border-radius: 4px;
    padding: 12px 14px;
    margin-top: 10px;
  }
  .supervisor-note-box label {
    font-size: 12px;
    color: #4338ca;
    text-transform: uppercase;
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.04em;
  }
  .supervisor-note-box p {
    font-size: 15px;
    color: var(--ink);
    margin-top: 5px;
    line-height: 1.4;
  }

  .change-history { margin-top: 10px; }
  .history-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;

// ─── Screen 1: Monthly Grid ───────────────────────────────────────────────────

function Screen1({ branchName, onCellClick, onAlertsClick, onBackToHome }) {
  const [showBoth, setShowBoth] = useState(false);
  const [month, setMonth] = useState('May 2026');
  const [paintMode, setPaintMode] = useState(null); // null | 'wa'|'wp'|'pto'|'co'|'oc'|'clear'
  const [selectedRows, setSelectedRows] = useState(new Set());
  const [schedule, setSchedule] = useState(SCHEDULE);
  const [recentlyPainted, setRecentlyPainted] = useState({}); // 'driverId-dk' -> timestamp
  const [paintCount, setPaintCount] = useState(0); // most-recent batch size for status banner

  // Paint chips that are bulk-safe. TR is intentionally excluded — training has cohort
  // context that should still go through the day-detail panel.
  const PAINT_CHIPS = [
  { code: 'wa', label: 'WA' },
  { code: 'wp', label: 'WP' },
  { code: 'pto', label: 'PTO' },
  { code: 'co', label: 'CO' },
  { code: 'oc', label: 'OC' },
  { code: 'clear', label: 'Clear' }];


  // Apply or remove the global paint-active class so cells get the crosshair cursor.
  useEffect(() => {
    if (paintMode) document.body.classList.add('paint-active');else
    document.body.classList.remove('paint-active');
    return () => document.body.classList.remove('paint-active');
  }, [paintMode]);

  // Esc exits paint mode and clears row selection.
  useEffect(() => {
    function onKey(e) {
      if (e.key === 'Escape') {
        setPaintMode(null);
        setSelectedRows(new Set());
      }
    }
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  function paintCell(driverId, dk) {
    const newCode = paintMode === 'clear' ? '—' : paintMode;
    setSchedule((prev) => ({
      ...prev,
      [driverId]: { ...prev[driverId], [dk]: newCode }
    }));
    const key = `${driverId}-${dk}`;
    setRecentlyPainted((prev) => ({ ...prev, [key]: Date.now() }));
    // Clear the just-painted ring after the animation
    setTimeout(() => {
      setRecentlyPainted((prev) => {
        const next = { ...prev };delete next[key];return next;
      });
    }, 700);
  }

  function handleCellClick(driver, dk, dayLabel) {
    if (!paintMode) {
      // Normal mode → open day-detail panel
      onCellClick(driver, dk, dayLabel);
      return;
    }
    // Paint mode: if this row is one of the selected rows AND there are multiple
    // selected, paint that column across all selected rows (one-click bulk).
    // Otherwise just paint this single cell.
    if (selectedRows.size > 1 && selectedRows.has(driver.id)) {
      selectedRows.forEach((rid) => paintCell(rid, dk));
      setPaintCount(selectedRows.size);
    } else {
      paintCell(driver.id, dk);
      setPaintCount(1);
    }
  }

  function toggleRow(driverId) {
    setSelectedRows((prev) => {
      const next = new Set(prev);
      if (next.has(driverId)) next.delete(driverId);else next.add(driverId);
      return next;
    });
  }

  function toggleAllRows() {
    setSelectedRows((prev) =>
    prev.size === DRIVERS.length ? new Set() : new Set(DRIVERS.map((d) => d.id))
    );
  }

  const activeChip = PAINT_CHIPS.find((c) => c.code === paintMode);

  return (
    <div className="screen-container" data-screen-label="01 Monthly Grid">
      {/* Header */}
      <div className="grid-header">
        <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
          <span className="branch-label">{branchName || 'NJ – Swedesboro'}</span>
          <span className="status-chip">Up to date</span>
          {onBackToHome &&
          <button
            onClick={onBackToHome}
            style={{
              background: 'transparent', border: '1.5px solid var(--border)',
              borderRadius: 4, padding: '4px 10px', fontSize: 12, cursor: 'pointer',
              color: 'var(--ink-light)', fontFamily: 'DM Sans'
            }}>
            ‹ All branches</button>
          }
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
          {/* Alerts bell */}
          <div
            style={{ position: 'relative', cursor: 'pointer' }}
            onClick={onAlertsClick}
            title="View change alerts">
            
            <span style={{ fontSize: 22 }}>🔔</span>
            <span style={{
              position: 'absolute', top: -4, right: -4,
              background: '#e53935', color: 'white',
              borderRadius: '50%', width: 16, height: 16,
              fontSize: 10, display: 'flex', alignItems: 'center', justifyContent: 'center',
              fontFamily: 'DM Mono', fontWeight: 600
            }}>5</span>
          </div>
          {/* Two-month toggle */}
          <label className="toggle-months" style={{ userSelect: 'none' }}>
            <div
              className={`toggle-switch ${showBoth ? 'on' : ''}`}
              onClick={() => setShowBoth((v) => !v)}>
              
              <div className="toggle-knob" />
            </div>
            <span>Show {showBoth ? 'one' : 'two'} months</span>
          </label>
          {/* Month nav */}
          <div className="month-nav">
            <button className="month-nav-btn">‹</button>
            <span className="month-label">{month}</span>
            <button className="month-nav-btn">›</button>
          </div>
        </div>
      </div>

      {showBoth &&
      <div className="callout" style={{ marginBottom: 12 }}>
          <span className="callout-icon">💡</span>
          Two-month view: scroll right to see June. Correna's request — no more manual spreadsheet toggling.
        </div>
      }

      {/* Paint-mode toolbar */}
      <div className="paint-toolbar">
        <span className="paint-toolbar-label">Apply status:</span>
        {PAINT_CHIPS.map((chip) =>
        <span
          key={chip.code}
          className={`paint-chip ${chip.code} ${paintMode === chip.code ? 'active' : ''}`}
          onClick={() => setPaintMode(paintMode === chip.code ? null : chip.code)}>
          {chip.label}</span>
        )}
        <span className="paint-help">
          {paintMode ?
          `Click cells to paint · Esc to exit` :
          `Click a status, then paint cells · Tip: tick rows to bulk-paint`}
        </span>
      </div>

      {paintMode &&
      <div className="paint-status">
          <span className="pulse"></span>
          <span>
            <strong>{activeChip?.label}</strong> loaded
            {selectedRows.size > 1 && <> · <strong>{selectedRows.size} rows selected</strong> — clicking any day paints across all selected drivers</>}
            {paintCount > 0 && <> · last action affected <strong>{paintCount} cell{paintCount === 1 ? '' : 's'}</strong></>}
          </span>
        </div>
      }

      {/* Grid */}
      <div className="sketch-card" style={{ overflowX: 'auto' }}>
        <table className="grid-table">
          <thead>
            <tr>
              <th className="row-check-col">
                <span
                  className={`row-check ${selectedRows.size === DRIVERS.length ? 'checked' : ''}`}
                  onClick={toggleAllRows}
                  title="Select all rows" />
                
              </th>
              <th>Driver</th>
              <th>Truck / cap</th>
              <th>Shift</th>
              {DAYS.map((d) => <th key={d} className="day-col">{d}</th>)}
            </tr>
          </thead>
          <tbody>
            {DRIVERS.map((driver) => {
              const sched = schedule[driver.id];
              const isSelected = selectedRows.has(driver.id);
              return (
                <tr key={driver.id} className={isSelected ? 'row-selected' : ''}>
                  <td className="row-check-col">
                    <span
                      className={`row-check ${isSelected ? 'checked' : ''}`}
                      onClick={(e) => {e.stopPropagation();toggleRow(driver.id);}}
                      title={isSelected ? 'Deselect row' : 'Select row for bulk paint'} />
                    
                  </td>
                  <td><div className="driver-name">{driver.name}</div></td>
                  <td>
                    <div className="driver-meta" style={{ fontSize: 15 }}>
                      {driver.truck ? driver.truck : <em>unassigned</em>}
                    </div>
                  </td>
                  <td><div className="driver-meta">{driver.shift}</div></td>
                  {DAY_KEYS.map((dk, i) => {
                    const code = sched[dk] || '—';
                    const hasNote = sched.note === dk;
                    const justKey = `${driver.id}-${dk}`;
                    const just = !!recentlyPainted[justKey];
                    return (
                      <td key={dk} className="day-cell">
                        <div className={just ? 'just-painted-wrap' : ''}>
                          <ShiftChipPaint
                            code={code}
                            hasNote={hasNote}
                            isJustPainted={just}
                            onClick={() => handleCellClick(driver, dk, DAYS[i])} />
                          
                        </div>
                      </td>);

                  })}
                </tr>);

            })}
          </tbody>
        </table>
      </div>

      {/* Legend */}
      <div className="legend">
        <div className="legend-item">
          <span className="legend-swatch" style={{ background: '#e8e0f5', borderColor: '#9b7ec8' }} />
          WA — Working AM
        </div>
        <div className="legend-item">
          <span className="legend-swatch" style={{ background: '#fce4ec', borderColor: '#e06090' }} />
          WP — Working PM
        </div>
        <div className="legend-item">
          <span className="legend-swatch" style={{ background: '#2a2a2a', borderColor: '#2a2a2a' }} />
          <span style={{ color: '#555' }}>PTO</span>
        </div>
        <div className="legend-item">
          <span className="legend-swatch" style={{ background: '#fff3cd', borderColor: '#d4a800' }} />
          CO — Call-out
        </div>
        <div className="legend-item">
          <span className="legend-swatch" style={{ background: '#d4edda', borderColor: '#4caf50' }} />
          OC — On-call
        </div>
        <div className="legend-item">
          <span className="legend-swatch" style={{ background: '#e3f2fd', borderColor: '#1976d2' }} />
          TR — Training
        </div>
        <div className="legend-item" style={{ marginLeft: 'auto' }}>
          <span style={{ color: '#4f46e5', fontSize: 12 }}>●</span>&nbsp;has note
        </div>
      </div>

      <div className="callout" style={{ marginTop: 14 }}>
        <span className="callout-icon">💡</span>
        Click any cell to open the Driver Day Detail panel. Or click a status above and paint cells in bulk — tick rows to paint across multiple drivers in one click.
      </div>
    </div>);

}

}

        </div>

      <div className="sketch-card">
        {groups.map((g) => {

          return (

                    )}
                    </div>
                  </div>
                </div>
              )}
            </div>);

        })}

      <div className="alerts-footer">
        <span>Showing {filtered.length} of 11 · last 24h</span>
        <button className="alerts-footer-btn">Notification settings</button>
      </div>

      <div className="callout" style={{ marginTop: 12 }}>
        <span className="callout-icon">💡</span>

}

    </div>);

}

// ─── App Shell ────────────────────────────────────────────────────────────────

function App() {
  const [role, setRole] = useState('central'); // 'central' | 'branch'
  const [activeBranch, setActiveBranch] = useState(null); // when null → BranchHome shown
  const [activeTab, setActiveTab] = useState('grid');
  const [panelDriver, setPanelDriver] = useState(null);
  const [panelDay, setPanelDay] = useState(null);
  const [panelDayLabel, setPanelDayLabel] = useState('');
  const [highlightAlert, setHighlightAlert] = useState(null);

  const openPanel = useCallback((driver, dk, dayLabel) => {
    setPanelDriver(driver);
    setPanelDay(dk);
    setPanelDayLabel(dayLabel);
  }, []);

  const closePanel = useCallback(() => {
    setPanelDriver(null);
    setPanelDay(null);
  }, []);

  const goToAlerts = useCallback((alertId) => {
    closePanel();
    setHighlightAlert(alertId || null);
    setActiveTab('alerts');
  }, [closePanel]);

  const handleAlertClick = useCallback((alert) => {
    const driver = DRIVERS.find((d) => d.id === alert.driverId);
    if (driver) {
      setHighlightAlert(null);
      setActiveTab('grid');
      setTimeout(() => {
        const dk = alert.day;
        const dayLabel = DAYS[DAY_KEYS.indexOf(dk)];
        openPanel(driver, dk, dayLabel);
      }, 50);
    }
  }, [openPanel]);

  const openBranch = useCallback((branch) => {
    setActiveBranch(branch);
    setActiveTab('grid');
    closePanel();
    setHighlightAlert(null);
  }, [closePanel]);

  const goHome = useCallback(() => {
    setActiveBranch(null);
    closePanel();
    setHighlightAlert(null);
  }, [closePanel]);

  // Switching role takes the user back to home (their scope just changed).
  function switchRole(newRole) {
    setRole(newRole);
    goHome();
  }

  return (
    <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
      {/* App bar */}
      <div style={{
        background: '#ffffff', borderBottom: '1px solid #e2e8f0',
        padding: '10px 24px',
        display: 'flex', alignItems: 'center', gap: 16,
        boxShadow: '0 1px 4px rgba(0,0,0,0.06)'
      }}>
        <span style={{ fontSize: 20, fontWeight: 700, color: 'var(--ink)', letterSpacing: '-0.01em' }}>
          WRE - FIG
        </span>
        <span style={{ fontSize: 13, color: 'var(--ink-faint)', fontFamily: 'DM Mono' }}>
          Field Information Guide
        </span>
        <div className="role-switcher" style={{ marginLeft: 16 }}>
          <button
            className={role === 'central' ? 'active' : ''}
            onClick={() => switchRole('central')}
            title="See all branches across all regions">
            Central Dispatch</button>
          <button
            className={role === 'branch' ? 'active' : ''}
            onClick={() => switchRole('branch')}
            title="See only your assigned branches">
            Branch user</button>
        </div>
        <span style={{ marginLeft: 'auto', fontSize: 13, color: 'var(--ink-faint)' }}>
          Wireframe prototype · Apr 2026
        </span>
      </div>

      {/* Breadcrumb (only when viewing a specific branch) */}
      {activeBranch &&
      <div className="breadcrumb">
          <a onClick={goHome}>{role === 'central' ? 'All branches' : 'My branches'}</a>
          <span className="sep">›</span>
          <strong style={{ color: 'var(--ink)' }}>{activeBranch.name}</strong>
        </div>
      }

      {/* Nav tabs — only visible when inside a branch */}
      {activeBranch &&
      <div className="nav-tabs">
          <button
          className={`nav-tab ${activeTab === 'grid' ? 'active' : ''}`}
          onClick={() => setActiveTab('grid')}>
          
            📅 Monthly Grid
          </button>
          <button
          className={`nav-tab ${activeTab === 'alerts' ? 'active' : ''}`}
          onClick={() => {setActiveTab('alerts');setHighlightAlert(null);}}>
          
            🔔 Change Alerts
            <span className="tab-badge">5</span>
          </button>
          <button
          className={`nav-tab ${activeTab === 'compliance' ? 'active' : ''}`}
          onClick={() => setActiveTab('compliance')}>
          
            📊 Branch Compliance
          </button>
        </div>
      }

      {/* Screens */}
      <div style={{ flex: 1 }}>
        {!activeBranch &&
        <BranchHome role={role} onOpenBranch={openBranch} />
        }
        {activeBranch && activeTab === 'grid' &&
        <Screen1
          branchName={activeBranch.name}
          onCellClick={openPanel}
          onAlertsClick={() => setActiveTab('alerts')}
          onBackToHome={goHome} />

        }
        {activeBranch && activeTab === 'alerts' &&
        <Screen3
          onAlertClick={handleAlertClick}
          highlightId={highlightAlert} />

        }
        {activeBranch && activeTab === 'compliance' &&
        <Screen4 />
        }
      </div>

      {/* Day detail panel overlay */}
      {panelDriver &&
      <Screen2
        driver={panelDriver}
        dayKey={panelDay}
        dayLabel={panelDayLabel}
        onClose={closePanel}
        onAlertClick={() => goToAlerts(null)} />

      }
    </div>);

}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
